name: 공휴일 자동 업데이트

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국시간 새벽 3시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 공휴일 데이터 받기
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: node scripts/update-holidays.mjs
      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- holidays.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git commit -m "chore: 공휴일 데이터 자동 업데이트"
          git push
